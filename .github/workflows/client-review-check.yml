name: Client Review Build Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Report typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: |
          echo "::warning::The repository-wide TypeScript check has existing errors. Review the TypeScript step logs; the production build is checked independently."
